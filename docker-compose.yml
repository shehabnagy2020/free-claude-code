# Docker Compose for Claude Code Proxy
# Connects to local providers (Ollama, LM Studio, Llama.cpp) running on the host machine

services:
  claude-code-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional: Build-time arguments
        BUILDKIT_INLINE_CACHE: "1"
    container_name: claude-code-proxy
    network_mode: host
    environment:
      # ==================== Server Config ====================
      - HOST=0.0.0.0
      - PORT=8082

      # ==================== Provider Selection ====================
      # Format: provider_type/model/name
      # Valid providers: nvidia_nim, google_gemini, open_router, deepseek, lmstudio, llamacpp, ollama
      - MODEL=${MODEL:-nvidia_nim/z-ai/glm4.7}

      # Per-model overrides (optional)
      - MODEL_OPUS=${MODEL_OPUS:-}
      - MODEL_SONNET=${MODEL_SONNET:-}
      - MODEL_HAIKU=${MODEL_HAIKU:-}

      # ==================== NVIDIA NIM ====================
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_PROXY=${NVIDIA_NIM_PROXY:-}

      # ==================== OpenRouter ====================
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_PROXY=${OPENROUTER_PROXY:-}

      # ==================== DeepSeek ====================
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}

      # ==================== Google Gemini ====================
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - GOOGLE_GEMINI_PROXY=${GOOGLE_GEMINI_PROXY:-}

      # ==================== LM Studio (host) ====================
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://127.0.0.1:1234/v1}
      - LMSTUDIO_PROXY=${LMSTUDIO_PROXY:-}

      # ==================== Llama.cpp (host) ====================
      - LLAMACPP_BASE_URL=${LLAMACPP_BASE_URL:-http://127.0.0.1:8080/v1}
      - LLAMACPP_PROXY=${LLAMACPP_PROXY:-}

      # ==================== Ollama (host) ====================
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://127.0.0.1:11434}

      # ==================== Authentication ====================
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - UI_PASSWORD=${UI_PASSWORD:-}

      # ==================== Messaging Platform ====================
      - MESSAGING_PLATFORM=${MESSAGING_PLATFORM:-none}
      - MESSAGING_RATE_LIMIT=${MESSAGING_RATE_LIMIT:-1}
      - MESSAGING_RATE_WINDOW=${MESSAGING_RATE_WINDOW:-1.0}

      # Telegram (if MESSAGING_PLATFORM=telegram)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ALLOWED_TELEGRAM_USER_ID=${ALLOWED_TELEGRAM_USER_ID:-}

      # Discord (if MESSAGING_PLATFORM=discord)
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - ALLOWED_DISCORD_CHANNELS=${ALLOWED_DISCORD_CHANNELS:-}

      # ==================== Voice Transcription ====================
      - VOICE_NOTE_ENABLED=${VOICE_NOTE_ENABLED:-false}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - HF_TOKEN=${HF_TOKEN:-}

      # ==================== Web Tools (Tavily) ====================
      - ENABLE_WEB_SERVER_TOOLS=${ENABLE_WEB_SERVER_TOOLS:-true}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}

      # ==================== Context Mode ====================
      - ENABLE_CONTEXT_MODE=${ENABLE_CONTEXT_MODE:-false}

      # ==================== Rate Limiting ====================
      - PROVIDER_RATE_LIMIT=${PROVIDER_RATE_LIMIT:-20}
      - PROVIDER_RATE_WINDOW=${PROVIDER_RATE_WINDOW:-60}
      - PROVIDER_MAX_CONCURRENCY=${PROVIDER_MAX_CONCURRENCY:-2}

      # ==================== HTTP Timeouts ====================
      - HTTP_READ_TIMEOUT=${HTTP_READ_TIMEOUT:-300.0}
      - HTTP_WRITE_TIMEOUT=${HTTP_WRITE_TIMEOUT:-60.0}
      - HTTP_CONNECT_TIMEOUT=${HTTP_CONNECT_TIMEOUT:-10.0}

      # ==================== Optimizations ====================
      - ENABLE_MODEL_THINKING=${ENABLE_MODEL_THINKING:-true}
      - FAST_PREFIX_DETECTION=${FAST_PREFIX_DETECTION:-true}
      - ENABLE_NETWORK_PROBE_MOCK=${ENABLE_NETWORK_PROBE_MOCK:-true}
      - ENABLE_TITLE_GENERATION_SKIP=${ENABLE_TITLE_GENERATION_SKIP:-true}
      - ENABLE_SUGGESTION_MODE_SKIP=${ENABLE_SUGGESTION_MODE_SKIP:-true}
      - ENABLE_FILEPATH_EXTRACTION_MOCK=${ENABLE_FILEPATH_EXTRACTION_MOCK:-true}

      # ==================== Debug Logging ====================
      - LOG_RAW_API_PAYLOADS=${LOG_RAW_API_PAYLOADS:-false}
      - LOG_RAW_SSE_EVENTS=${LOG_RAW_SSE_EVENTS:-false}
      - LOG_API_ERROR_TRACEBACKS=${LOG_API_ERROR_TRACEBACKS:-false}
      - LOG_RAW_MESSAGING_CONTENT=${LOG_RAW_MESSAGING_CONTENT:-false}
      - LOG_RAW_CLI_DIAGNOSTICS=${LOG_RAW_CLI_DIAGNOSTICS:-false}
      - LOG_MESSAGING_ERROR_DETAILS=${LOG_MESSAGING_ERROR_DETAILS:-false}

      # ==================== Performance ====================
      # Higher concurrency for PM2-like throughput
      - PROVIDER_MAX_CONCURRENCY=${PROVIDER_MAX_CONCURRENCY:-10}
    volumes:
      # Workspace for Claude Code agent
      - ./agent_workspace:/app/agent_workspace
      # Mount .env file for runtime configuration
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
