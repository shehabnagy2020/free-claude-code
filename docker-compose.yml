# Docker Compose for Claude Code Proxy
# Supports all providers: NVIDIA NIM, OpenRouter, DeepSeek, Google Gemini, LM Studio, Llama.cpp, Ollama

services:
  claude-code-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional: Build-time arguments
        BUILDKIT_INLINE_CACHE: "1"
    container_name: claude-code-proxy
    ports:
      - "8082:8082"
    environment:
      # ==================== Server Config ====================
      - HOST=0.0.0.0
      - PORT=8082

      # ==================== Provider Selection ====================
      # Format: provider_type/model/name
      # Valid providers: nvidia_nim, google_gemini, open_router, deepseek, lmstudio, llamacpp, ollama
      - MODEL=${MODEL:-nvidia_nim/z-ai/glm4.7}

      # Per-model overrides (optional)
      - MODEL_OPUS=${MODEL_OPUS:-}
      - MODEL_SONNET=${MODEL_SONNET:-}
      - MODEL_HAIKU=${MODEL_HAIKU:-}

      # ==================== NVIDIA NIM ====================
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_PROXY=${NVIDIA_NIM_PROXY:-}

      # ==================== OpenRouter ====================
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_PROXY=${OPENROUTER_PROXY:-}

      # ==================== DeepSeek ====================
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}

      # ==================== Google Gemini ====================
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - GOOGLE_GEMINI_PROXY=${GOOGLE_GEMINI_PROXY:-}

      # ==================== LM Studio ====================
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://lm-studio:1234/v1}
      - LMSTUDIO_PROXY=${LMSTUDIO_PROXY:-}

      # ==================== Llama.cpp ====================
      - LLAMACPP_BASE_URL=${LLAMACPP_BASE_URL:-http://llama-cpp:8080/v1}
      - LLAMACPP_PROXY=${LLAMACPP_PROXY:-}

      # ==================== Ollama ====================
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}

      # ==================== Authentication ====================
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - UI_PASSWORD=${UI_PASSWORD:-}

      # ==================== Messaging Platform ====================
      - MESSAGING_PLATFORM=${MESSAGING_PLATFORM:-none}
      - MESSAGING_RATE_LIMIT=${MESSAGING_RATE_LIMIT:-1}
      - MESSAGING_RATE_WINDOW=${MESSAGING_RATE_WINDOW:-1.0}

      # Telegram (if MESSAGING_PLATFORM=telegram)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ALLOWED_TELEGRAM_USER_ID=${ALLOWED_TELEGRAM_USER_ID:-}

      # Discord (if MESSAGING_PLATFORM=discord)
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - ALLOWED_DISCORD_CHANNELS=${ALLOWED_DISCORD_CHANNELS:-}

      # ==================== Voice Transcription ====================
      - VOICE_NOTE_ENABLED=${VOICE_NOTE_ENABLED:-false}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - HF_TOKEN=${HF_TOKEN:-}

      # ==================== Web Tools (Tavily) ====================
      - ENABLE_WEB_SERVER_TOOLS=${ENABLE_WEB_SERVER_TOOLS:-true}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}

      # ==================== Context Mode ====================
      - ENABLE_CONTEXT_MODE=${ENABLE_CONTEXT_MODE:-false}

      # ==================== Rate Limiting ====================
      - PROVIDER_RATE_LIMIT=${PROVIDER_RATE_LIMIT:-20}
      - PROVIDER_RATE_WINDOW=${PROVIDER_RATE_WINDOW:-60}
      - PROVIDER_MAX_CONCURRENCY=${PROVIDER_MAX_CONCURRENCY:-2}

      # ==================== HTTP Timeouts ====================
      - HTTP_READ_TIMEOUT=${HTTP_READ_TIMEOUT:-300.0}
      - HTTP_WRITE_TIMEOUT=${HTTP_WRITE_TIMEOUT:-60.0}
      - HTTP_CONNECT_TIMEOUT=${HTTP_CONNECT_TIMEOUT:-10.0}

      # ==================== Optimizations ====================
      - ENABLE_MODEL_THINKING=${ENABLE_MODEL_THINKING:-true}
      - FAST_PREFIX_DETECTION=${FAST_PREFIX_DETECTION:-true}
      - ENABLE_NETWORK_PROBE_MOCK=${ENABLE_NETWORK_PROBE_MOCK:-true}
      - ENABLE_TITLE_GENERATION_SKIP=${ENABLE_TITLE_GENERATION_SKIP:-true}
      - ENABLE_SUGGESTION_MODE_SKIP=${ENABLE_SUGGESTION_MODE_SKIP:-true}
      - ENABLE_FILEPATH_EXTRACTION_MOCK=${ENABLE_FILEPATH_EXTRACTION_MOCK:-true}

      # ==================== Debug Logging ====================
      - LOG_RAW_API_PAYLOADS=${LOG_RAW_API_PAYLOADS:-false}
      - LOG_RAW_SSE_EVENTS=${LOG_RAW_SSE_EVENTS:-false}
      - LOG_API_ERROR_TRACEBACKS=${LOG_API_ERROR_TRACEBACKS:-false}
      - LOG_RAW_MESSAGING_CONTENT=${LOG_RAW_MESSAGING_CONTENT:-false}
      - LOG_RAW_CLI_DIAGNOSTICS=${LOG_RAW_CLI_DIAGNOSTICS:-false}
      - LOG_MESSAGING_ERROR_DETAILS=${LOG_MESSAGING_ERROR_DETAILS:-false}
    volumes:
      # Workspace for Claude Code agent
      - ./agent_workspace:/app/agent_workspace
      # Optional: Mount .env file
      - ${ENV_FILE:-./.env}:/app/.env:ro
    restart: unless-stopped
    networks:
      - claude-network
    extra_hosts:
      # Allow container to access host services (for local providers)
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
      - lm-studio

  # Ollama service - Local LLM provider
  # Pull and run models: docker exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - claude-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # LM Studio service - Local LLM provider with OpenAI-compatible API
  # Note: LM Studio Desktop runs on host (Windows/Mac/Linux).
  # For Docker, use the official LM Studio CLI or run host desktop app.
  # This service is disabled by default - see README for setup.
  # lm-studio:
  #   image: ghcr.io/lmstudio-ai/lmstudio:latest
  #   container_name: lm-studio
  #   ports:
  #     - "1234:1234"
  #   volumes:
  #     - lmstudio_models:/root/.cache/lmstudio
  #   environment:
  #     - LMSTUDIO_HOST=0.0.0.0
  #     - LMSTUDIO_PORT=1234
  #   restart: unless-stopped
  #   networks:
  #     - claude-network
  #   # GPU required for inference (uncomment for NVIDIA GPU)
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # Llama.cpp service - Lightweight local LLM inference
  # Run models: docker exec llama-cpp ./llama-cli -m /models/your-model.gguf
  llama-cpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: llama-cpp
    ports:
      - "8080:8080"
    volumes:
      - llama_models:/models
    environment:
      - MODEL_PATH=/models/${LLAMA_CPP_MODEL:-}
      - HOST=0.0.0.0
      - PORT=8080
    restart: unless-stopped
    networks:
      - claude-network
    # GPU acceleration (uncomment for NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_data:
    driver: local
  lmstudio_models:
    driver: local
  llama_models:
    driver: local

networks:
  claude-network:
    driver: bridge
